<h2 mat-dialog-title class="dialog-title">Додати страву</h2>

<mat-dialog-content class="dialog-content">
  <mat-form-field class="full-width">
    <mat-label>Назва</mat-label>
    <input matInput [(ngModel)]="dish.name">
  </mat-form-field>

  <mat-form-field class="full-width">
    <mat-label>Ціна</mat-label>
    <input matInput type="number" [(ngModel)]="dish.price">
  </mat-form-field>

  <mat-form-field class="full-width">
    <mat-label>Опис</mat-label>
    <textarea matInput [(ngModel)]="dish.description"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-button (click)="dialogRef.close()" class="cancel-button">Скасувати</button>
  <button mat-raised-button color="primary" (click)="addDish()" class="add-button">Додати</button>
</mat-dialog-actions>
