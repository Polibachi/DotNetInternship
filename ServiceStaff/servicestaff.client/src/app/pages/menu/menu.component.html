<header>
  <div class="header">
    <mat-toolbar>
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
        <mat-icon>menu</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item routerLink="/menu">
          <mat-icon>menu</mat-icon>
          <span>Меню</span>
        </button>
        <button mat-menu-item routerLink="/orders">
          <mat-icon>shopping_cart</mat-icon>
          <span>Замовлення</span>
        </button>
        <button mat-menu-item >
          <mat-icon>data_thresholding</mat-icon>
          <span>Адмінка</span>
        </button>
        <button mat-menu-item (click)="logOut()">
          <mat-icon>logout</mat-icon>
          <span>Вийти</span>
        </button>
      </mat-menu>
      <div class="toolbar no-select">
        <span style="margin-right: 10px;">🍽 Service Staff</span>
      </div>
      <span class="example-spacer"></span>
    </mat-toolbar>
  </div>
</header>

<body>
  <div class="dishes-container">
    <mat-card class="dish-card" *ngFor="let dish of dishes">
      <mat-card-header>
        <mat-card-title>{{ dish.name }}</mat-card-title>
      </mat-card-header>

      <img mat-card-image [src]="getDishImage(dish.id)" alt="{{ dish.name }}">
      <mat-card-content>
        <p>{{ dish.description }}</p>
      </mat-card-content>
      <mat-card-subtitle>{{ dish.price }} UAH</mat-card-subtitle>
      <mat-card-actions>
        <button mat-button (click)="addToCart(dish.id)">
          <mat-icon>add</mat-icon>Додати до замовлення
        </button>
      </mat-card-actions>
    </mat-card>


    <mat-card class="dish-card add-dish-icon">
      <mat-card-header>
        <mat-card-title>Додати страву</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <p>Додайте нову страву до меню</p>
        <p>Назва фото: {{ getLastDishIdPlusOne() }}.jpeg</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" (click)="openAddDishDialog()">
          <mat-icon>add</mat-icon> Додати страву
        </button>
      </mat-card-actions>
    </mat-card>
    

  </div>
  <div class="floor">
    <mat-card-content class="cart-container" *ngIf="cart.length > 0">
      <button mat-button routerLink="/orders">
        <h2>Корзина</h2>
      </button>
      <mat-list>
        <mat-list-item *ngFor="let item of cart">
          <span>{{ getDishName(item.dishId) }} ({{ item.quantity }})</span>
        </mat-list-item>
      </mat-list>
      <button mat-button color="warn" (click)="clearCart()">Очистити корзину</button>
    </mat-card-content>
  </div>

</body>
