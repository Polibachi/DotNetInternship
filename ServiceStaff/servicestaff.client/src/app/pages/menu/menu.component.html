<header>
  <div class="header">
    <mat-toolbar>
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
        <mat-icon>menu</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item>
          <mat-icon>menu</mat-icon>
          <span>Redial</span>
        </button>
        <button mat-menu-item disabled>
          <mat-icon>voicemail</mat-icon>
          <span>Check voice mail</span>
        </button>
        <button mat-menu-item>
          <mat-icon>notifications_off</mat-icon>
          <span>Disable alerts</span>
        </button>
      </mat-menu>
      <div class="toolbar no-select">
        <span style="margin-right: 10px;">🍽 Service Staff</span>
      </div>
      <span class="example-spacer"></span>
    </mat-toolbar>
  </div>
</header>

<body>
  <div class="dishes-container">
    <mat-card *ngFor="let dish of dishes" class="example-card" appearance="outlined">
      <mat-card-header>
        <div mat-card-avatar class="example-header-image"></div>
        <mat-card-title>{{ dish.name }}</mat-card-title>
      </mat-card-header>

      <img mat-card-image src="https://material.angular.io/assets/img/examples/shiba2.jpg" alt="{{ dish.name }}">
      <mat-card-content>
        <p>{{ dish.description }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button>Додати до замовлення</button>
      </mat-card-actions>
      <mat-card-subtitle>{{ dish.price }} UAH</mat-card-subtitle>

    </mat-card>
  </div>
</body>
