<div class="register-container">
  <h2>Реєстрація</h2>
  <form #registerForm="ngForm" (ngSubmit)="register()">

    <label for="email">Email:</label>
    <input type="text" id="email" [(ngModel)]="user.email" name="email" required />
    <div *ngIf="registerForm.submitted && !user.email" class="error">Введіть Email</div>

    <label for="password">Пароль:</label>
    <div class="password-field">
      <input [type]="showPassword ? 'text' : 'password'"
             id="password"
             [(ngModel)]="user.password"
             name="password"
             required>
      <button type="button" (click)="togglePasswordVisibility()" class="toggle-password">
        <span *ngIf="showPassword">👁️</span>
        <span *ngIf="!showPassword">👁️‍🗨️</span>
      </button>
    </div>
    <div *ngIf="registerForm.submitted && !user.password" class="error">Введіть пароль</div>

    <label for="name">Ім'я:</label>
    <input type="text" id="name" [(ngModel)]="user.name" name="name" required />
    <div *ngIf="registerForm.submitted && !user.name" class="error">Введіть ім'я</div>

    <div class="role-container">
      <label for="role">Роль:</label>
      <select id="role" [(ngModel)]="user.role" name="role" required>
        <option value="">Оберіть роль</option>
        <option value="staff">Офіціант</option>
        <option value="chef">Кухар</option>
        <option value="admin">Адміністратор</option>
      </select>
      <div *ngIf="registerForm.submitted && !user.role" class="error">Оберіть роль</div>
    </div>

    <button type="submit">Зареєструватися</button>

  </form>
</div>
